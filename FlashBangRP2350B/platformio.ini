; FlashBangRP2350B - self-contained SST39SF040 programmer
;
; Target: custom board with a Raspberry Pi RP2350B (48-GPIO package) wired
; directly to an SST39SF040 flash (see Docs/PinConnections.md).
;
; Core: earlephilhower Arduino-Pico via the community raspberrypi platform.
; The firmware uses the raw pico-sdk GPIO API (gpio_*_masked64) with absolute
; GPIO numbers, so the exact Arduino board variant only needs to be an RP2350B
; target with all 48 pads enabled (PICO_RP2350A=0).
; download/upload stream directly chip<->serial, so no large RAM buffer is
; used (the full 512 KByte image does not fit next to the USB/network stack).

[env:rp2350b]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

build_flags =
  ; RP2350B / QFN-80: 48 usable GPIOs (pads 0..47). Mandatory for A18=GPIO47.
  -D PICO_RP2350A=0
  ; Optional: fine-tune the parallel-bus timing (default 6).
  ; -D BUS_DELAY_LOOPS=6

; If 'generic_rp2350' is unavailable in your installed core, any other RP2350B
; board works too, e.g.:
;   board = pimoroni_pico_plus_2
